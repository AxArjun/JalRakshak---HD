# JalRakshak-HD - Verified Dam Engineering Configuration
# Milestone: M3 — Verified Dam Engineering Inputs and Breach Event Definition (Final Source Reconciliation)
# Study Site: Bhavanisagar Dam (Lower Bhavani Dam), Bhavani River, Tamil Nadu, India

observed:
