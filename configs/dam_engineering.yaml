    unit: "m3"
    verification_level: "MODEL_ASSUMPTION_FIRST_ESTIMATE"
    source: "CWC Hydrological Data Book 2020 live storage record (780.5 MCM)"
    justification: "First-estimate active breach volume assumption in absence of dynamic stage-storage routing and surveyed invert datum. NOT observed breachable volume."

  final_breach_height_hb_m:
    value: 40.0
    unit: "metres"
    verification_level: "MODEL_ASSUMPTION_FIRST_ESTIMATE"
    source: "Hypothetical complete-breach depth assumption"
    justification: "This is a hypothetical complete-breach depth assumption and is not the published maximum dam height (which is 62.0 m / 62.18 m for the deepest masonry foundation). Sensitivity-ready parameter."

  initial_water_depth_above_breach_invert_hw_m:
    value: 32.0
    unit: "metres"
    verification_level: "MODEL_ASSUMPTION_FIRST_ESTIMATE"
    source: "Authoritative Full Depth (105 ft = 32.004 m) above operational dead sill datum"
    justification: "Initial hydraulic water column depth above breach invert at FRL"

