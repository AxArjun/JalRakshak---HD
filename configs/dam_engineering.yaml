    value: 8316.0
    unit: "metres"
    verification_level: "MODEL_DERIVED_APPROXIMATION"
    derivation_method: "Arithmetic subtraction: Technical Dam Length (8780.0 m) minus Central Masonry Section (464.0 m) = 8316.0 m (or 8797 - 464 = 8333.0 m from NRLD 2019). This is an arithmetic derivation, not a published survey quantity."

